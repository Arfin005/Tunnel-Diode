<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resonant Tunneling Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
/* Layout: three-pane instrument bench — contents rail | reading column | live lab stage (always dark, like a scope screen) */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --ink:#121826; --muted:#566176; --line:#d8dee8; --soft:#e9eef7;
  --accent:#1c58d0; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --trap:#b8293f; --trap-bg:#fbedf0; --idea:#a95a07; --idea-bg:#fdf2e3; --memo:#137a52; --memo-bg:#e6f4ed; --note-bg:#eef2f8;
  --stage:#0a0f16; --stage-2:#111926; --stage-3:#18222f; --stage-line:#243246; --stage-ink:#d6dfeb; --stage-muted:#8191aa; --stage-accent:#6ea2ff;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --top-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --panel:#121821; --ink:#e3e9f2; --muted:#94a1b6; --line:#243041; --soft:#172131;
  --accent:#7aa8ff; --accent-ink:#0b1220; --accent-soft:#18243a;
  --trap:#ff8094; --trap-bg:#2a151b; --idea:#f2aa52; --idea-bg:#281d10; --memo:#55d39e; --memo-bg:#10261d; --note-bg:#151e2b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --panel:#121821; --ink:#e3e9f2; --muted:#94a1b6; --line:#243041; --soft:#172131;
  --accent:#7aa8ff; --accent-ink:#0b1220; --accent-soft:#18243a;
  --trap:#ff8094; --trap-bg:#2a151b; --idea:#f2aa52; --idea-bg:#281d10; --memo:#55d39e; --memo-bg:#10261d; --note-bg:#151e2b;
  color-scheme:dark}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top-h);flex:none;display:flex;align-items:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.icon{width:34px;padding:0;justify-content:center}
#menuBtn{display:none}

.shell{flex:1;min-height:0;display:grid;grid-template-columns:264px minmax(0,1fr) minmax(0,1.18fr)}
.toc{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px))}
.toc h2{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 8px 10px;font-weight:700}
.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.toc a .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:34px;padding-top:1px;font-variant-numeric:tabular-nums}
.toc a.l1{font-weight:600;margin-top:6px}
.toc a.l2{padding-left:18px;font-size:13px}
.toc a.l3{padding-left:30px;font-size:12.5px;color:var(--muted)}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--accent-soft);color:var(--accent)}
.toc a.on .n{color:var(--accent)}

.read{overflow:auto;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.read article{max-width:640px;margin:0 auto}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.04em;display:flex;gap:10px;align-items:center}
.eyebrow .pill{border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:0 8px;font-size:11px}
.read h1{font-family:var(--f-display);font-weight:700;font-size:29px;line-height:1.15;letter-spacing:-.015em;margin:8px 0 18px;text-wrap:balance}
.read h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:26px 0 8px;text-wrap:balance}
.read p{margin:0 0 13px}
.read ul,.read ol{margin:0 0 14px;padding-left:22px}
.read li{margin:3px 0}
.read strong{font-weight:600}
.read .kw{color:var(--accent);font-weight:600}
.m{font-family:var(--f-math);font-size:1.08em}
.try sub,.try sup{font-size:.72em;line-height:0}
.m i{font-style:italic}
.m .rm{font-style:normal}
.m sub,.m sup{font-size:.72em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.sq{white-space:nowrap}.sqb{border-top:1px solid currentColor;padding:0 .12em;margin-left:.04em}
.bx{border:1.5px solid currentColor;padding:.15em .45em;border-radius:3px;display:inline-block;max-width:100%}
.read p .bx,.read li .bx{display:inline;line-height:2;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.eq{display:flex;align-items:center;gap:12px;margin:14px 0 16px;padding:14px 16px;background:var(--note-bg);border-radius:8px;overflow-x:auto}
.eq>div{flex:1;min-width:0;text-align:center;font-family:var(--f-math);font-size:1.12em;line-height:1.9}
.eq .eqn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.co{border-radius:8px;padding:12px 15px;margin:16px 0;background:var(--note-bg)}
.co>b:first-child{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.co p:last-child{margin-bottom:0}
.co.trap{background:var(--trap-bg)} .co.trap>b:first-child{color:var(--trap)}
.co.idea{background:var(--idea-bg)} .co.idea>b:first-child{color:var(--idea)}
.co.memo{background:var(--memo-bg)} .co.memo>b:first-child{color:var(--memo)}
.co.lab>b:first-child{color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0 18px}
.tw{overflow-x:auto}
table.t th,table.t td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--f-display);font-weight:600;font-size:12.5px;color:var(--muted)}
table.t td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.try{display:inline-flex;align-items:center;gap:6px;margin:2px 6px 6px 0;padding:5px 10px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer}
.try:hover{background:var(--accent);color:var(--accent-ink)}
.try::before{content:"▶";font-size:9px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:18px 0}
.subs a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35;background:var(--panel)}
.subs a:hover{border-color:var(--accent)}
.subs a span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.pager{max-width:640px;margin:34px auto 0;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.pager a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);font-size:14px;max-width:48%;font-weight:500}
.pager a small{color:var(--muted);font-size:11.5px;font-family:var(--f-mono)}
.pager a.next{text-align:right;margin-left:auto}

/* Lab stage */
.lab{min-width:0;display:flex;flex-direction:column;background:var(--stage);color:var(--stage-ink);border-left:1px solid var(--line);
  padding-right:env(safe-area-inset-right,0px)}
.lab-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--stage-line)}
.lab-head .tabs{flex:1;min-width:0;flex-wrap:wrap}
.lab-head .lbl{font-family:var(--f-mono);font-size:11px;color:var(--stage-muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--stage-line);background:var(--stage-2);color:var(--stage-ink);cursor:pointer;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab .k{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--stage-3);color:var(--stage-muted)}
.tab:hover{border-color:var(--stage-accent)}
.tab.on{background:var(--stage-accent);border-color:var(--stage-accent);color:#08101d}
.tab.on .k{background:rgba(8,16,29,.18);color:#08101d}
.screen{position:relative;flex:1 1 auto;min-height:280px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#101a28 0%,var(--stage) 70%)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#c3{touch-action:none;cursor:grab}
#c3:active{cursor:grabbing}
#hv{position:absolute;inset:0;overflow:auto;padding:16px}
.hint{position:absolute;left:12px;bottom:10px;font-family:var(--f-mono);font-size:11px;color:var(--stage-muted);pointer-events:none;background:rgba(10,15,22,.6);padding:2px 7px;border-radius:4px}
.tools{flex:none;display:flex;gap:5px}
.tools button{height:30px;min-width:30px;padding:0 9px;border-radius:6px;border:1px solid var(--stage-line);background:rgba(17,25,38,.85);color:var(--stage-ink);cursor:pointer;font-size:12px;font-family:var(--f-mono)}
.tools button:hover{border-color:var(--stage-accent)}
.tools button.on{border-color:var(--stage-accent);color:var(--stage-accent)}
.vt{flex:none;padding:8px 14px 9px;border-bottom:1px solid var(--stage-line);background:var(--stage-2)}
.vt b{display:block;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--stage-ink);line-height:1.3}
.vt small{display:block;color:var(--stage-muted);font-size:12px;line-height:1.35;margin-top:1px}
.vt .hint2{font-family:var(--f-mono);font-size:10.5px;color:#6f7f98;margin-top:2px}
.vt sub,.vt sup,.readout sub,.readout sup{font-size:.72em;line-height:0}
.readout{flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1px;background:var(--stage-line);border-top:1px solid var(--stage-line)}
.readout div{background:var(--stage-2);padding:6px 10px;min-width:0}
.readout span{display:block;font-size:10.5px;color:var(--stage-muted);font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout b{display:block;font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout b.good{color:#4fe0a4}.readout b.bad{color:#ff6f93}.readout b.warn{color:#f6c04a}
.controls{flex:none;max-height:36%;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 18px;padding:12px 14px 14px;border-top:1px solid var(--stage-line);background:var(--stage-2)}
.ctl{min-width:0}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--stage-muted);margin-bottom:2px}
.ctl label output{font-family:var(--f-mono);color:var(--stage-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl label .m{font-size:1.05em;color:var(--stage-ink)}
.ctl input[type=range]{width:100%;accent-color:var(--stage-accent);height:20px}
.ctl select{width:100%;height:30px;border-radius:6px;border:1px solid var(--stage-line);background:var(--stage-3);color:var(--stage-ink);padding:0 8px;font-size:12.5px}
.ctl.chk label{justify-content:flex-start;align-items:center;gap:8px;color:var(--stage-ink);cursor:pointer;margin-top:18px}
.ctl.chk input{accent-color:var(--stage-accent);width:16px;height:16px}
.noctl{font-size:12px;color:var(--stage-muted)}

/* html views inside the stage */
.calc{font-size:13.5px;color:var(--stage-ink);max-width:760px;margin:30px auto 0}
.calc .step{border:1px solid var(--stage-line);border-radius:8px;padding:10px 14px;margin:0 0 10px;background:rgba(17,25,38,.7)}
.calc .step.on{border-color:var(--stage-accent);box-shadow:0 0 0 1px var(--stage-accent) inset}
.calc .step h4{margin:0 0 4px;font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--stage-accent)}
.calc .step .m{font-size:1.05em}
.calc .res{font-family:var(--f-mono);color:#4fe0a4}
.calc svg{width:100%;height:auto;display:block}

@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
  .toc{position:fixed;z-index:30;top:calc(var(--top-h) + env(safe-area-inset-top,0px));bottom:0;left:0;width:300px;max-width:86vw;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .toc.open{transform:none}
  #menuBtn{display:inline-flex}
  .brand span{display:none}
}
@media (max-width:860px){
  .app{height:auto}
  .shell{display:flex;flex-direction:column}
  .lab{order:-1;border-left:0}
  .screen{flex:none;height:56vh;min-height:300px}
  .lab-head{flex-wrap:wrap}
  .controls{max-height:none}
  .read{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .read h1{font-size:24px}
  #tSpin,#tFront{display:none}
  .wide-l{display:none}
  .top .btn{padding:0 10px}
  .brand b{font-size:15px}
}
@media (prefers-reduced-motion: reduce){.toc{transition:none}}
</style>

<div class="app">
  <header class="top">

    <div class="brand">

      <b>Resonant Tunneling Lab</b><span>Resonant-tunneling diode · Part 6</span>
    </div>
    <div class="grow"></div>

  </header>
  <div class="shell">

<script>
'use strict';
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const lin=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function si(x,unit,d=3){
  if(!isFinite(x))return '—';
  if(x===0)return '0 '+unit;
  const P=[[1e12,'T'],[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f'],[1e-18,'a']];
  const a=Math.abs(x);
  for(const [s,p] of P){if(a>=s*0.9995)return (+(x/s).toPrecision(d))+' '+p+unit}
  return x.toExponential(2)+' '+unit;
}
function num(x,d=3){
  if(!isFinite(x))return '—';
  const a=Math.abs(x);
  if(a!==0&&(a>=1e5||a<1e-3)){const e=Math.floor(Math.log10(a));return (x/10**e).toFixed(2)+'×10'+sup(e)}
  return String(+x.toPrecision(d));
}
function sup(n){const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};return String(n).split('').map(c=>m[c]||c).join('')}
var MOTION=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ================= tiny TeX-like math markup =================
   x_P, x_{ab}, x^2, \f{num}{den}, \s{radicand}, \t{roman text}, \B{boxed} */
function grp(s,i){
  if(s[i]!=='{')return [s[i]||'',i+1];
  let d=0,j=i;
  for(;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(!d)break}}
  return [s.slice(i+1,j),j+1];
}
function tex(s){
  let o='',i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='\\'){
      const mm=/^\\([a-zA-Z]+)/.exec(s.slice(i));
      if(!mm){o+=s[i+1]||'';i+=2;continue}
      const n=mm[1];i+=mm[0].length;
      if(n==='f'){const [a,i1]=grp(s,i);const [b,i2]=grp(s,i1);o+=`<span class="fr"><span>${tex(a)}</span><span>${tex(b)}</span></span>`;i=i2}
      else if(n==='s'){const [a,i1]=grp(s,i);o+=`<span class="sq">√<span class="sqb">${tex(a)}</span></span>`;i=i1}
      else if(n==='t'){const [a,i1]=grp(s,i);o+=`<span class="rm">${a}</span>`;i=i1}
      else if(n==='B'){const [a,i1]=grp(s,i);o+=`<span class="bx">${tex(a)}</span>`;i=i1}
      else o+=n;
    }else if(c==='&'&&/^&(lt|gt|amp);/.test(s.slice(i))){const e=/^&(lt|gt|amp);/.exec(s.slice(i))[0];o+=e;i+=e.length;
    }else if(c==='_'||c==='^'){

function tModel(T,heavy){const Eg=0.7437-4.774e-4*T*T/(T+235),Eg3=0.7437-4.774e-4*9e4/535;const a=heavy?0.0012:-0.0025;
  const b=MATS.Ge.m;return mk({...b,T,Eg,Ip:b.Ip*(1+a*(T-300)),Iv:b.Iv*(1+0.002*(T-300)),I0:b.I0*(T/300)**3*Math.exp(-(Eg/(KB*T)-Eg3/(KB*300)))})}

  draw(g,W,H,p,t,S){
    const heavy=p.dop==='heavy';const bs=boxes(W,H,[1.4,1],{t:46,gap:40});
    const p1=new P2(g,bs[0],{x:[0,0.6],y:[0,14],xl:'Forward voltage V (V)',yl:'I (mA)'});p1.frame();
    for(const T of [240,300,360,420])p1.curve(v=>Itot(tModel(T,heavy),v),{c:C.mute,w:1.1,a:.6});
    const m=tModel(p.T,heavy);p1.curve(v=>Itot(m,v),{c:p.T>300?C.red:C.t,w:2.8});const P=pv(m,0.6);p1.dot(P.Vp,P.Ip,C.ndr,5.5,'I_P = '+mA(P.Ip));
    legend(g,bs[0].x,24,[[p.T>300?C.red:C.t,'T = '+p.T+' K'],[C.mute,'240 · 300 · 360 · 420 K']]);
    const p2=new P2(g,bs[1],{x:[220,420],y:[6,14],xl:'Temperature T (K)',yl:'I_P (mA)'});p2.frame();
    p2.curve(T=>pv(tModel(T,heavy),0.6).Ip,{c:heavy?C.d:C.ndr,w:2.6,n:80});p2.dot(p.T,P.Ip,'#fff',5.5);
  },
  read(p){const heavy=p.dop==='heavy',m=tModel(p.T,heavy),P=pv(m,0.6),d=(pv(tModel(p.T+1,heavy),0.6).Ip-pv(tModel(p.T-1,heavy),0.6).Ip)/2;
    return [['E_g(T)',m.Eg.toFixed(4)+' eV'],['I_P',mA(P.Ip)],['dI_P/dT',(d*1000).toFixed(1)+' µA/K',d>0?'good':'bad'],['I_V',mA(P.Iv)],['PVR',P.pvr.toFixed(2)+' : 1']]}
};

/* ---------- time-domain oscillator ---------- */
function simOsc(p){
  const m=DEF,L=p.L,Cp=p.Cj,Rs=p.Rs,Vb=p.Vb;const per=2*Math.PI*Math.sqrt(L*Cp)*31.623;
  const Tend=Math.min(2e5,Math.max(per*16,L/Math.max(Rs,0.5)*1000*6));
  let dt=Math.min(per/400,Cp*1.0);if(Tend/dt>2.5e5)dt=Tend/2.5e5;
  const N=Math.ceil(Tend/dt),every=Math.max(1,Math.floor(N/1600));
  let i=0,v=0;const f=(i,v)=>{v=clamp(v,-0.3,1.0);return [(Vb-Rs*i/1000-v)/L,(i-Itot(m,v))*1e-3/Cp]};
  const ts=[],vs=[],is=[];
  for(let k=0;k<N;k++){
    const a=f(i,v),b=f(i+a[0]*dt/2,v+a[1]*dt/2),c=f(i+b[0]*dt/2,v+b[1]*dt/2),d=f(i+c[0]*dt,v+c[1]*dt);
    i+=dt/6*(a[0]+2*b[0]+2*c[0]+d[0]);v+=dt/6*(a[1]+2*b[1]+2*c[1]+d[1]);v=clamp(v,-0.3,1.0);
    if(k%every===0){ts.push(k*dt);vs.push(v);is.push(i)}
  }
  const h=Math.floor(vs.length/2),tail=vs.slice(h),mean=tail.reduce((a,b)=>a+b,0)/tail.length;let cr=[];for(let k=h+1;k<vs.length;k++)if(vs[k-1]<mean&&vs[k]>=mean)cr.push(ts[k]);
  const amp=Math.max(...tail)-Math.min(...tail);const f0=cr.length>2&&amp>0.005?(cr.length-1)/(cr[cr.length-1]-cr[0])*1e12:0;
  const ops=[];let prev=null;for(let k=0;k<=600;k++){const vv=k/1000;const r=(Vb-vv)*1000/Rs-Itot(m,vv);if(prev!==null&&Math.sign(r)!==Math.sign(prev.r))ops.push(vv);prev={r}}
  return {ts,vs,is,amp,f0,ops,Tend};
}

const cx={m:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],a:(a,b)=>[a[0]+b[0],a[1]+b[1]],s:(a,b)=>[a[0]-b[0],a[1]-b[1]],d:(a,b)=>{const q=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q]},e:th=>[Math.cos(th),Math.sin(th)],k:(a,s)=>[a[0]*s,a[1]*s]};
function waveSolve(p){
  const k=Math.sqrt(p.m*p.E/0.0381),q=Math.sqrt(p.m*p.U/0.0381),a=p.a;
  const C1=cx.e(k*a),D1=cx.k(cx.m([0,k],C1),1/q),ch=Math.cosh(q*a),sh=Math.sinh(q*a);
  const psi0=cx.s(cx.k(C1,ch),cx.k(D1,sh)),dpsi0=cx.k(cx.a(cx.k(C1,-sh),cx.k(D1,ch)),q);
  const s=cx.d([2,0],cx.a(psi0,cx.d(dpsi0,[0,k])));const r=cx.s(cx.m(s,psi0),[1,0]);
  const f=x=>{if(x<0)return cx.a(cx.e(k*x),cx.m(r,cx.e(-k*x)));if(x<=a){const u=x-a;return cx.m(s,cx.a(cx.k(C1,Math.cosh(q*u)),cx.k(D1,Math.sinh(q*u))))}return cx.m(s,cx.e(k*x))};
  return {k,q,r,t:s,T:s[0]**2+s[1]**2,R:r[0]**2+r[1]**2,f};
}

/* ================= Part 6: resonant-tunnelling diode — physics ================= */

const _wl={};
function wellLevels(U,W,m){

    const f=n%2===0?z=>z*Math.tan(z)-Math.sqrt(Math.max(0,z0*z0-z*z)):z=>-z/Math.tan(z)-Math.sqrt(Math.max(0,z0*z0-z*z));
    let x0=lo,x1=hi;for(let i=0;i<70;i++){const xm=(x0+x1)/2;if(f(xm)>0)x1=xm;else x0=xm}
    const z=(x0+x1)/2;out.push(z*z*HB2M/(m*a*a));

}
function Einf(n,W,m){return n*n*Math.PI*Math.PI*HB2M/(m*W*W)}
/* exact single rectangular barrier: Ek kinetic energy outside, Ub barrier height above that band edge */
function Trect(Ek,Ub,d,m){
  if(Ek<=0)return 0;
  if(Math.abs(Ub-Ek)<1e-9)Ub+=1e-7;
  if(Ub>Ek){const k=Math.sqrt(m*(Ub-Ek)/HB2M),s=Math.sinh(k*d);return 1/(1+Ub*Ub*s*s/(4*Ek*(Ub-Ek)))}

}
/* conduction-band profile under bias (linear drop over barrier-well-barrier) */
function Ux(P,V,x){const L=P.L;if(x<0)return 0;if(x<P.d1)return P.U-V*x/L;if(x<P.d1+P.W)return -V*x/L;if(x<L)return P.U-V*x/L;return -V}
function regions(P,V){

  for(const [len,top] of [[P.d1,P.U],[P.W,0],[P.d2,P.U]]){const dl=len/ns;for(let i=0;i<ns;i++){const xm=x+(i+.5)*dl;out.push({U:top-V*xm/P.L,L:dl,x:x+i*dl})}x+=len}

}
/* transfer matrix (constant effective mass) */
const C_={mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],div:(a,b)=>{const q=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q]},add:(a,b)=>[a[0]+b[0],a[1]+b[1]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],exp:z=>{const e=Math.exp(z[0]);return [e*Math.cos(z[1]),e*Math.sin(z[1])]},abs2:a=>a[0]*a[0]+a[1]*a[1]};

function tmmMats(P,E,V,R){

  let M=[[[1,0],[0,0]],[[0,0],[1,0]]];

       [C_.add(C_.mul(Ij[1][0],M[0][0]),C_.mul(Ij[1][1],M[1][0])),C_.add(C_.mul(Ij[1][0],M[0][1]),C_.mul(Ij[1][1],M[1][1]))]];

function tmmT(P,E,V,R){if(E<=0)return 0;const {M,ks}=tmmMats(P,E,V,R);const k0=ks[0][0],kN=ks[ks.length-1][0];if(kN<=0)return 0;return clamp((k0/kN)/C_.abs2(M[1][1]),0,1)}
/* wavefunction ψ(x) for a wave incident from the emitter */
function tmmPsi(P,E,V){

/* resonance peaks of the exact T(E): position, height, FWHM */
const _pk={};
function tmmPeaks(P,V=0,Emax){
  Emax=Emax||Math.max(P.U*1.15,0.05);const key=[P.W,P.d1,P.d2,P.U,P.m,V,Emax].join();if(_pk[key])return _pk[key];
  const R=regions(P,V),n=3000,Es=lin(1e-5,Emax,n),Ts=Es.map(E=>tmmT(P,E,V,R)),pk=[];
  for(let i=1;i<n-1;i++)if(Ts[i]>Ts[i-1]&&Ts[i]>=Ts[i+1]&&Ts[i]>1e-6){
    let a=Es[i-1],b=Es[i+1];for(let it=0;it<50;it++){const c=b-(b-a)/1.618,d=a+(b-a)/1.618;if(tmmT(P,c,V,R)>tmmT(P,d,V,R))b=d;else a=c}

/* resonance model used for the current: guide's Eq. 64 peak, ΔE = ħ/τ width, level shift f·qV (Eq. 71) */
function resPar(P,n,V){

  const E0=P.lv[n],Ee=E0-P.f*V;

}
const jAt=(c,V)=>{const n=c.Vs.length-1,u=clamp(V/c.Vm,0,1)*n,i=Math.min(n-1,Math.floor(u)),f=u-i;return c.J[i]*(1-f)+c.J[i+1]*f};

      for(let k=0;k<N;k++){const a=fn(i,v),b=fn(i+a[0]*dt/2,v+a[1]*dt/2),c=fn(i+b[0]*dt/2,v+b[1]*dt/2),d=fn(i+c[0]*dt,v+c[1]*dt);i+=dt/6*(a[0]+2*b[0]+2*c[0]+d[0]);v=clamp(v+dt/6*(a[1]+2*b[1]+2*c[1]+d[1]),-0.2,1.5);if(k%every===0){ts.push(k*dt);vs.push(v);is.push(i)}}
      const h=Math.floor(vs.length*0.6),tail=vs.slice(h),mean=tail.reduce((a,b)=>a+b,0)/tail.length;const cr=[];for(let k=h+1;k<vs.length;k++)if(vs[k-1]<mean&&vs[k]>=mean)cr.push(ts[k]);

    const mk=(n)=>{const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));const l=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffe08a}));g.add(l);return l};
    inc=mk(200);cav=mk(200);tr=mk(200);
    return {update(p){clearGroup(dyn);const F=4*p.Rm/(1-p.Rm)**2,d=2*Math.PI/p.lam*2,T=1/(1+F*Math.sin(d/2)**2);P_={T,F,lam:p.lam,Rm:p.Rm};dyn.add(tlabel('T = '+T.toFixed(3),{size:.45,pos:[4.6,1.6,0],color:T>0.5?'#3fd29b':'#ff9ab4'}))},
      tick(t){const k=2*Math.PI/(P_.lam*1.5),w=MOTION?t*4:0,set=(l,x0,x1,A,stand)=>{const a=l.geometry.attributes.position;for(let i=0;i<200;i++){const x=lerp(x0,x1,i/199);const y=stand?A*Math.sin(k*(x+1.5))*Math.cos(w):A*Math.sin(k*x-w);a.setXYZ(i,x,y,0)}a.needsUpdate=true;l.geometry.computeBoundingSphere()};
        const T=P_.T||0;set(inc,-6,-1.5,0.8,false);set(cav,-1.5,1.5,clamp(0.8*Math.sqrt(T/(1-P_.Rm)),0.02,1.4),true);set(tr,1.5,6,0.8*Math.sqrt(T),false)}}},
  read(p){const F=4*p.Rm/(1-p.Rm)**2,T=1/(1+F*Math.sin(2*Math.PI/p.lam)**2);return [['T',T.toFixed(4),T>0.5?'good':'warn'],['finesse F',F.toFixed(1)],['analogue','photon ↔ electron · mirror ↔ barrier']]}
});
